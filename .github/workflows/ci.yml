name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whale
          POSTGRES_PASSWORD: whale
          POSTGRES_DB: whale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whale -d whale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgresql://whale:whale@localhost:5432/whale
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      HOST: http://localhost:3000
      UPLOAD_PATH: public/uploads
      UPLOAD_SERVE_PATH: uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
